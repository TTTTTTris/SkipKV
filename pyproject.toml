[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skipkv"
version = "0.1.0"
requires-python = ">=3.9"
description = "SkipKV: Selective Skipping of KV Generation and Storage for Efficient Inference with Large Reasoning Models"
readme = "README.md"
dependencies = [
	"click==8.1.7",
	"datasets==2.19.2",
	"ipython==8.12.3",
	"latex2sympy2",
	"loguru==0.7.3",
	"matplotlib==3.10.6",
	"mpmath==1.3.0",
	"multiprocess==0.70.16",
	"numpy",
	"pandas==2.3.3",
	"pebble==5.1.1",
	"peft==0.6.2",
	"pytest==8.4.2",
	"python_dateutil==2.9.0.post0",
	"regex==2024.9.11",
	"seaborn==0.13.2",
	"setuptools==80.9.0",
	"sympy==1.14.0",
	"timeout_decorator==0.5.0",
	"torch==2.4.0",
	"tqdm==4.67.1",
	"transformers==4.53.0",
	"word2number==1.1",
]

[tool.setuptools]
packages = ["skipkv"]
